services:
  - type: web
    name: daklak-travel-ai-backend
    runtime: python
    rootDir: chung-khao
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/chung-khao
      - key: ENVIRONMENT
        value: production
      - key: LLM_API_KEY
        sync: false
      - key: AI_LOG_API_KEY
        sync: false
